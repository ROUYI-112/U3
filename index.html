<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>星窗魔法單字｜一次 5 個字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#090d2b; --indigo:#1a1f5c; --violet:#34287e;
  --glass:rgba(24,21,70,.9); --glass2:rgba(40,33,104,.85);
  --line:rgba(190,170,255,.32);
  --ink:#fff6fc; --soft:#cbbfee;
  --pink:#f59ac6; --pink-d:#d8649f; --magenta:#e451c0; --rose:#e2416a;
  --lav:#b8a4ff; --cyan:#7ad8ff; --aqua:#6ce9cf; --gold:#ffd56b;
  --glow:0 0 0 2px var(--line),0 10px 30px rgba(5,5,30,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(24,21,70,.9)}}
:root[data-theme="dark"]{--glass:rgba(24,21,70,.9)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;color:var(--ink);font-size:19px;line-height:1.5;overflow-x:hidden;
  font-family:"M PLUS Rounded 1c","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:
    radial-gradient(ellipse 70% 45% at 50% 18%,rgba(120,150,255,.45),transparent 70%),
    radial-gradient(ellipse 50% 40% at 8% 25%,rgba(228,81,192,.35),transparent 70%),
    radial-gradient(ellipse 45% 40% at 95% 60%,rgba(122,216,255,.22),transparent 70%),
    linear-gradient(180deg,#0b1240 0%,#1a1f5c 45%,#24185a 75%,#0a0a26 100%);
  background-attachment:fixed;
}
.en{font-family:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",sans-serif}
.deco{font-family:"Cinzel",Georgia,serif;letter-spacing:.18em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* background */
#dome{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.7}
.twinkle{position:fixed;inset:0;z-index:0;pointer-events:none}
.twinkle i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 3s ease-in-out infinite}
.twinkle b{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--magenta);animation:rise linear infinite;opacity:.7}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
@keyframes rise{to{transform:translateY(-110vh) translateX(30px);opacity:0}}

#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 16px 44px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

/* top */
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back{border:0;background:var(--glass);border-radius:14px;padding:8px 12px;font-weight:800;box-shadow:var(--glow);font-size:.95rem}
.top .title{flex:1;font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 12px rgba(245,154,198,.6)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--glass);border-radius:99px;padding:5px 11px;font-weight:800;font-size:.95rem;box-shadow:var(--glow);white-space:nowrap}
.chip.score{color:var(--gold)}
.chip.score.bump{animation:bump .4s}
.chip.combo{color:var(--pink)}
.chip.combo.hot{box-shadow:0 0 0 2px var(--magenta),0 0 18px var(--magenta)}
@keyframes bump{40%{transform:scale(1.18)}}
.icon{border:0;background:var(--glass);border-radius:50%;width:38px;height:38px;font-size:1rem;box-shadow:var(--glow);flex:none}

/* journey bar */
.journey{background:var(--glass);border-radius:18px;padding:10px 14px 12px;box-shadow:var(--glow);margin-bottom:12px}
.journey .lab{display:flex;justify-content:space-between;font-weight:800;font-size:.85rem;color:var(--soft);margin-bottom:6px}
.journey .lab b{color:var(--gold)}
.track{position:relative;height:16px;border-radius:99px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px var(--line)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--magenta),var(--pink),var(--lav),var(--cyan));box-shadow:0 0 14px rgba(228,81,192,.7);transition:width .7s cubic-bezier(.3,1.4,.5,1);min-width:16px}
.fill::after{content:"★";position:absolute;right:-6px;top:50%;transform:translateY(-52%);color:var(--gold);font-size:22px;text-shadow:0 0 10px var(--gold);animation:spin 3s linear infinite}
@keyframes spin{to{transform:translateY(-52%) rotate(360deg)}}
.miles{display:flex;justify-content:space-between;margin-top:6px;font-size:.78rem;font-weight:800;color:var(--soft)}
.miles span.on{color:var(--ink)}

/* hero */
.hero{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.hero h1{margin:0;font-size:1.65rem;line-height:1.15;text-shadow:0 0 16px rgba(228,81,192,.7)}
.hero .deco{display:block;font-size:.62rem;color:var(--pink);margin-bottom:2px}
.hero p{margin:3px 0 0;color:var(--soft);font-weight:700;font-size:.9rem}
.mascot{width:80px;height:92px;flex:none;filter:drop-shadow(0 0 12px rgba(228,81,192,.65))}
.mascot.jump{animation:jump .6s ease}
.mascot.hug{animation:hug .7s ease}
@keyframes jump{30%{transform:translateY(-16px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
@keyframes hug{30%{transform:scale(1.12)}60%{transform:scale(.96)}}
.flame-body{transform-origin:50% 90%;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg) scaleY(1.03)}}
.lvcard{background:var(--glass);border-radius:20px;padding:12px 14px;box-shadow:var(--glow);margin-bottom:14px}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.lvrow .t{color:var(--pink)}
.lvrow .n{color:var(--gold)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:rgba(255,255,255,.06);filter:grayscale(1);opacity:.35;border:0}
.badge.got{filter:none;opacity:1;background:linear-gradient(135deg,rgba(228,81,192,.35),rgba(122,216,255,.25));box-shadow:0 0 12px rgba(245,154,198,.45)}

.units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.unit{border:2px solid var(--line);background:var(--glass);border-radius:16px;padding:9px 4px;font-weight:800;text-align:center;line-height:1.25}
.unit small{display:block;font-size:.76rem;color:var(--soft);font-weight:700}
.unit.on{border-color:var(--pink);box-shadow:0 0 16px rgba(245,154,198,.55);background:linear-gradient(180deg,rgba(228,81,192,.35),var(--glass))}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.group{border:0;text-align:left;border-radius:20px 20px 14px 14px;padding:14px;position:relative;overflow:clip;
  background:linear-gradient(160deg,rgba(122,216,255,.18),rgba(228,81,192,.18) 60%,rgba(52,40,126,.6)),var(--glass);
  box-shadow:var(--glow);transition:transform .15s;overflow:hidden}
.group::before{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 49%,rgba(10,12,40,.6) 49%,rgba(10,12,40,.6) 51%,transparent 51%),
  linear-gradient(0deg,transparent 64%,rgba(10,12,40,.5) 64%,rgba(10,12,40,.5) 66%,transparent 66%);opacity:.5;pointer-events:none}
.group:active{transform:scale(.97)}
.group>*{position:relative}
.group b{display:block;font-size:1.05rem}
.group .peek{display:block;color:var(--soft);font-size:.8rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group .st{margin-top:6px;font-size:.9rem;font-weight:800;color:var(--gold)}
.group.next{box-shadow:0 0 0 2px var(--pink),0 0 22px rgba(228,81,192,.7);animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 2px var(--pink),0 0 34px rgba(228,81,192,.95)}}
.group.next::after{content:"下一關 ✦";position:absolute;top:8px;right:10px;background:var(--magenta);color:#fff;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px}

/* card */
.card{background:var(--glass);border-radius:26px;padding:22px 20px;box-shadow:var(--glow);position:relative;overflow:hidden;overflow:clip}
.card::before{content:"";position:absolute;top:0;left:0;width:100%;height:60%;background:radial-gradient(ellipse at center,rgba(245,154,198,.18),transparent 60%);pointer-events:none}
.card>*{position:relative}
.orbwrap{display:flex;justify-content:center;align-items:center;gap:14px;margin:4px 0 10px}
.orb{border:0;width:110px;height:110px;border-radius:50%;font-size:2.6rem;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ffd0ea,var(--magenta) 55%,#7a2a9a);box-shadow:0 0 0 6px rgba(245,154,198,.25),0 0 40px rgba(228,81,192,.8)}
.orb.playing{animation:ring 1s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(245,154,198,.7),0 0 40px rgba(228,81,192,.8)}100%{box-shadow:0 0 0 26px rgba(245,154,198,0),0 0 40px rgba(228,81,192,.8)}}
.mini{border:0;width:58px;height:58px;border-radius:50%;font-size:1.4rem;background:var(--glass2);box-shadow:var(--glow)}
.mini.playing{animation:bump .5s infinite}
.word{font-size:2.5rem;font-weight:700;text-align:center;line-height:1.1;word-break:break-word;text-shadow:0 0 18px rgba(184,164,255,.7)}
.posrow{text-align:center;margin-top:6px}
.pos{display:inline-block;background:rgba(255,213,107,.18);color:var(--gold);border-radius:8px;padding:1px 9px;font-weight:800;font-size:.85rem}
.zhbox{text-align:center;margin:14px 0 4px;min-height:58px;display:flex;justify-content:center;align-items:center}
.reveal{border:0;border-radius:99px;padding:13px 26px;font-weight:800;font-size:1.15rem;color:#fff;
  background:linear-gradient(90deg,var(--magenta),var(--pink));box-shadow:0 5px 0 #8f2a76,0 0 22px rgba(228,81,192,.7);transition:opacity .3s}
.reveal.wait{opacity:.45;background:var(--glass2);box-shadow:var(--glow);pointer-events:none}
.reveal.ready{animation:pop .45s}
.zh{font-size:1.7rem;font-weight:800;color:var(--pink);text-shadow:0 0 14px rgba(245,154,198,.6);animation:pop .45s}
.more{max-height:0;opacity:0;overflow:hidden;transition:max-height .7s ease,opacity .5s ease}
.more.show{max-height:1400px;opacity:1}
.sec{margin-top:16px}
.sec h3{margin:0 0 8px;font-size:.88rem;color:var(--soft);letter-spacing:.06em}
.collos{display:flex;flex-direction:column;gap:8px}
.collo{display:flex;align-items:center;gap:8px;border:0;width:100%;text-align:left;background:rgba(122,216,255,.13);border-radius:14px;padding:9px 12px;box-shadow:inset 0 0 0 1.5px rgba(122,216,255,.35)}
.collo .en{font-weight:600;font-size:1.08rem;color:var(--cyan)}
.collo small{color:var(--soft);font-weight:700;margin-left:auto;text-align:right;flex:none;max-width:42%}
.collo.playing{animation:bump .5s infinite}
.example{background:rgba(9,13,43,.55);border-radius:16px;padding:14px;font-size:1.18rem;line-height:1.8;box-shadow:inset 0 0 0 1.5px var(--line)}
.hole{border:0;display:inline-block;min-width:100px;padding:0 10px;margin:0 2px;border-radius:10px;background:rgba(255,213,107,.16);border-bottom:3px solid var(--gold);font-weight:700;color:transparent;position:relative;line-height:1.5;vertical-align:baseline}
.hole::after{content:"點我 ✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:.85rem;font-family:"M PLUS Rounded 1c",sans-serif}
.hole.open{color:var(--pink);background:rgba(228,81,192,.22);border-bottom-color:var(--pink);animation:pop .35s}
.hole.open::after{content:none}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--cyan);text-align:center;color:var(--cyan);font-weight:700}
.blank.filled{color:var(--aqua);border-color:var(--aqua);animation:pop .35s}
.exzh{margin-top:8px;color:var(--soft);font-size:.95rem;font-weight:700}
.tipbox{margin-top:12px;background:rgba(226,65,106,.18);color:#ffb3c6;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.95rem}
.tw{color:var(--cyan);font-weight:700}
.nc{text-decoration:underline wavy var(--pink);text-underline-offset:5px;text-decoration-thickness:1.5px}
.say{border:0;border-radius:99px;padding:7px 13px;font-weight:800;background:rgba(122,216,255,.16);color:var(--cyan);font-size:.92rem}
.say.playing{animation:bump .5s infinite}
.dots{display:flex;justify-content:center;gap:8px;margin:16px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);transition:.2s}
.dots i.on{background:var(--pink);width:30px;border-radius:99px;box-shadow:0 0 10px var(--magenta)}
.dots i.seen{background:var(--gold)}
.nav{display:flex;gap:10px}
.hint{flex:1;text-align:center;color:var(--soft);font-weight:700;padding:14px 0}
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:800;font-size:1.1rem;transition:transform .1s;flex:1;color:#fff}
.btn:active{transform:translateY(4px)}
.btn.ghost{background:var(--glass2);flex:0 0 auto;box-shadow:var(--glow)}
.btn.go{background:linear-gradient(90deg,var(--magenta),var(--pink));box-shadow:0 5px 0 #8f2a76,0 0 20px rgba(228,81,192,.5)}
.btn.ok{background:linear-gradient(90deg,#3aa9e0,var(--aqua));color:#08203a;box-shadow:0 5px 0 #1f6f96,0 0 20px rgba(108,233,207,.45)}

/* quiz */
.wstars{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.wstar{display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--soft);font-weight:800;width:58px;text-align:center;line-height:1.2}
.wstar span{font-size:1.7rem;filter:grayscale(1);opacity:.3;transition:.3s}
.wstar.half span{filter:none;opacity:.65}
.wstar.full span{filter:drop-shadow(0 0 8px var(--gold));opacity:1;animation:pop .45s}
.wstar em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58px}
.qlabel{display:inline-block;background:rgba(184,164,255,.2);color:var(--lav);font-weight:800;border-radius:99px;padding:4px 12px;font-size:.88rem}
.qtitle{font-size:1.15rem;font-weight:800;margin:10px 0 12px}
.sentence{font-size:1.25rem;line-height:1.85;background:rgba(9,13,43,.55);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:inset 0 0 0 1.5px var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:0;background:var(--glass2);border-radius:18px;padding:14px;font-size:1.2rem;font-weight:700;text-align:center;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 rgba(0,0,0,.3);transition:transform .1s}
.opt:active{transform:translateY(3px)}
.opt.right{background:linear-gradient(90deg,rgba(108,233,207,.35),rgba(122,216,255,.3));box-shadow:inset 0 0 0 2px var(--aqua),0 0 20px rgba(108,233,207,.6);animation:pop .4s}
.opt.soft{background:rgba(245,154,198,.18);box-shadow:inset 0 0 0 2px var(--pink)}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.07)}}
.fb{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:64px}
.fb .mascot{width:58px;height:66px}
.bubble{background:rgba(9,13,43,.7);border-radius:18px;padding:10px 14px;font-weight:800;position:relative;flex:1;box-shadow:inset 0 0 0 2px var(--line)}
.bubble.good{box-shadow:inset 0 0 0 2px var(--aqua);color:var(--aqua)}
.bubble.kind{box-shadow:inset 0 0 0 2px var(--pink);color:var(--pink)}
.bubble small{display:block;font-weight:700;color:var(--soft);margin-top:2px}
.fly{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:1.35rem;color:var(--gold);text-shadow:0 0 10px var(--gold),0 2px 0 #6b3a00;transition:transform .75s cubic-bezier(.5,-.3,.6,1),opacity .75s}

/* overlays */
.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(9,13,43,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s}
.burstcard{text-align:center;padding:26px 30px;border-radius:28px;background:linear-gradient(160deg,rgba(228,81,192,.5),rgba(52,40,126,.95));box-shadow:0 0 0 2px var(--pink),0 0 60px rgba(228,81,192,.8);animation:zoom .5s cubic-bezier(.3,1.6,.5,1)}
.burstcard .deco{color:var(--gold);font-size:.75rem}
.burstcard h2{margin:6px 0;font-size:1.9rem;text-shadow:0 0 16px var(--pink)}
.burstcard p{margin:0;color:var(--soft);font-weight:800}
@keyframes zoom{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.done{text-align:center}
.trophy{font-size:4.5rem;filter:drop-shadow(0 0 20px var(--gold));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.done h2{margin:6px 0;font-size:1.6rem;text-shadow:0 0 16px rgba(228,81,192,.7)}
.bigscore{font-size:2.6rem;font-weight:700;color:var(--gold);text-shadow:0 0 18px rgba(255,213,107,.7)}
.statrow{display:flex;justify-content:center;gap:10px;margin:14px 0 18px;flex-wrap:wrap}
.stat{background:var(--glass);border-radius:16px;padding:10px 14px;box-shadow:var(--glow);min-width:92px}
.stat b{display:block;font-size:1.45rem;color:var(--pink)}
.stat small{color:var(--soft);font-weight:700}
.col{display:flex;flex-direction:column;gap:12px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:65}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-260%);background:linear-gradient(90deg,rgba(52,40,126,.97),rgba(120,40,120,.97));box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(255,213,107,.5);border-radius:18px;padding:10px 16px;font-weight:800;z-index:80;transition:transform .45s cubic-bezier(.3,1.6,.5,1);max-width:92vw;display:flex;gap:10px;align-items:center}
.toast{opacity:0}.toast.show{transform:translate(-50%,0);opacity:1}
.toast .ic{font-size:1.7rem}
.toast small{display:block;color:var(--soft);font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg id="dome" aria-hidden="true" preserveAspectRatio="xMidYMin slice"></svg>
<div class="twinkle" id="twinkle" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<main id="app"></main>
<script>
const CARDS = [
 {id:"civilization",t:"word",w:"civilization",p:"n.",zh:"文明",ex:"The new port and bridges brought <mark>civilization</mark> to the rather isolated island.",tip:"bring A to B 帶給 B 某物；別寫成 conflict"},
 {id:"isolated",t:"word",w:"isolated",p:"adj.",zh:"偏遠的；隔絕的",ex:"The new port and bridges brought civilization to the rather <mark>isolated</mark> island."},
 {id:"universal",t:"word",w:"universal",p:"adj.",zh:"普遍的；全人類的",ex:"There seems to be a <mark>universal</mark> fear of death among all people."},
 {id:"enable",t:"word",w:"enable",p:"v.",zh:"使能夠",ex:"Powerful telescopes <mark>enable</mark> us to observe distant planets.",tip:"enable + 人 + to V"},
 {id:"observe",t:"word",w:"observe",p:"v.",zh:"觀察",ex:"Powerful telescopes enable us to <mark>observe</mark> distant planets."},
 {id:"enormous",t:"word",w:"enormous",p:"adj.",zh:"巨大的；廣大的",ex:"Powerful telescopes enable us to observe distant planets, moons, and stars in this <mark>enormous</mark> universe."},
 {id:"universe",t:"word",w:"universe",p:"n.",zh:"宇宙",ex:"Powerful telescopes enable us to observe distant planets, moons, and stars in this enormous <mark>universe</mark>."},
 {id:"massage",t:"word",w:"massage",p:"n.",zh:"按摩",ex:"A foot <mark>massage</mark> may seem like torture at the time."},
 {id:"torture",t:"word",w:"torture",p:"n.",zh:"折磨；痛苦",ex:"A foot massage may seem like <mark>torture</mark> at the time."},

let actx;
function ac(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==="suspended")actx.resume();return actx;}
function tone(f,d,type="sine",v=.11,delay=0){if(S.muted)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
 o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);}

/* ---------- fx ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener("resize",resize);resize();
const COLS=["#f59ac6","#e451c0","#ffd56b","#7ad8ff","#b8a4ff","#ffffff"];
function burst(x,y,n=24,pow=1){if(reduce)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(2+Math.random()*4.5)*pow;
 parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.5,r:2.5+Math.random()*3.5,c:COLS[i%COLS.length],l:55+Math.random()*35,s:Math.random()<.6,rot:Math.random()*6});}if(!raf)loop();}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.l>0);
 for(const p of parts){p.vy+=.12;p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.l--;p.rot+=.12;cx.save();cx.globalAlpha=Math.min(1,p.l/25);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=8;cx.translate(p.x,p.y);cx.rotate(p.rot);
  if(p.s){cx.beginPath();for(let i=0;i<8;i++){const rr=i%2?p.r*.4:p.r*1.6,a=i*Math.PI/4;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.fill();}else{cx.beginPath();cx.arc(0,0,p.r,0,Math.PI*2);cx.fill();}cx.restore();}
 raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,innerWidth,innerHeight),null);}
function rain(n=7){for(let i=0;i<n;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*(.15+Math.random()*.3),26,1.2),i*120);}
let tq=[],ton=false;
function toast(ic,t,sub=""){tq.push({ic,t,sub});if(!ton)nextToast();}
function nextToast(){const x=tq.shift();if(!x){ton=false;return;}ton=true;const el=$("#toast");
 el.innerHTML=`<span class="ic">${x.ic}</span><div>${x.t}${x.sub?`<small>${x.sub}</small>`:""}</div>`;el.classList.add("show");
 setTimeout(()=>{el.classList.remove("show");setTimeout(nextToast,400);},2200);}
function overlay(deco,title,sub,ms=1500){const o=document.createElement("div");o.className="overlay";
 o.innerHTML=`<div class="burstcard"><div class="deco">${deco}</div><h2>${title}</h2><p>${sub}</p></div>`;document.body.appendChild(o);
 o.onclick=()=>o.remove();setTimeout(()=>o.remove(),ms);}

function addScore(n,fromEl,label){
 const before=level(S.score);S.score+=n;save();
 const chip=$("#scoreChip");
 if(fromEl&&chip&&!reduce){const a=fromEl.getBoundingClientRect(),b=chip.getBoundingClientRect();
  const f=document.createElement("div");f.className="fly en";f.textContent=label||("+"+n);
  f.style.left=(a.left+a.width/2-24)+"px";f.style.top=(a.top+a.height/2-14)+"px";document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.transform=`translate(${b.left-a.left-a.width/2+30}px,${b.top-a.top-a.height/2+10}px) scale(.7)`;f.style.opacity=".2";});
  setTimeout(()=>{f.remove();countUp();},760);
 }else countUp();
 const after=level(S.score);
 if(after>before)setTimeout(()=>{SFX.win();rain(9);overlay("LEVEL UP",`Lv.${after}　${TITLES[Math.min(after-1,TITLES.length-1)]}`,"魔力又變強了！",2000);},800);
 checkBadges();
}
function giveBadge(id){if(S.badges[id])return;S.badges[id]=Date.now();save();const b=BADGES.find(x=>x.id===id);
 setTimeout(()=>{SFX.star();toast(b.ic,"獲得徽章："+b.n,b.d);},500);}
function checkBadges(){
 if(S.brave>=10)giveBadge("brave");if(S.listens>=50)giveBadge("ear");if(S.score>=5000)giveBadge("s5k");
 if(S.bestCombo>=10)giveBadge("c10");if(S.bestCombo>=25)giveBadge("c25");
 if(Object.keys(S.cleared).length>=1)giveBadge("first");
 const unitDone=u=>u.groups.every((_,i)=>S.cleared[gid(u,i)]);
 if(UNITS.some(unitDone))giveBadge("unit");if(UNITS.every(unitDone))giveBadge("all");
}

/* mascot: original pink magic flame with a ribbon */

 const mouth=mood==="wow"?'<ellipse cx="50" cy="68" rx="5" ry="6" fill="#5a1a3a"/>'
   :mood==="kind"?'<path d="M44 66 q6 4 12 0" stroke="#5a1a3a" stroke-width="3" fill="none" stroke-linecap="round"/>'
   :'<path d="M42 64 q8 9 16 0" stroke="#5a1a3a" stroke-width="3" fill="#ff8fb5" stroke-linecap="round"/>';
 const eyes=mood==="happy"||mood==="wow"
   ?'<path d="M36 54 q4 -6 8 0" stroke="#5a1a3a" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M56 54 q4 -6 8 0" stroke="#5a1a3a" stroke-width="3.2" fill="none" stroke-linecap="round"/>'
   :'<circle cx="40" cy="54" r="4.4" fill="#5a1a3a"/><circle cx="60" cy="54" r="4.4" fill="#5a1a3a"/><circle cx="41.6" cy="52.4" r="1.5" fill="#fff"/><circle cx="61.6" cy="52.4" r="1.5" fill="#fff"/>';
 return `<svg class="mascot ${cls}" viewBox="0 0 100 116" aria-hidden="true"><g class="flame-body">
  <path d="M50 10 C62 28 84 38 84 70 C84 94 68 110 50 110 C32 110 16 94 16 70 C16 52 28 44 32 30 C38 40 42 42 44 34 C46 26 46 20 50 10Z" fill="#e451c0"/>
  <path d="M50 40 C58 52 72 60 72 78 C72 94 62 102 50 102 C38 102 28 94 28 78 C28 66 36 60 40 52 C44 58 48 54 50 40Z" fill="#f9b8d8"/>
  <path d="M50 18 L34 8 L36 26Z M50 18 L66 8 L64 26Z" fill="#e2416a"/><circle cx="50" cy="18" r="5" fill="#ff6b8e"/>
  ${eyes}${mouth}<ellipse cx="32" cy="64" rx="5" ry="3" fill="#ff9ec4"/><ellipse cx="68" cy="64" rx="5" ry="3" fill="#ff9ec4"/>
  <path d="M80 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffd56b"/></g></svg>`;
}

/* ---------- shared UI ---------- */
let unit=UNITS.find(u=>u.k===S.unit)||UNITS[0], gi=0, li=0, phase={}, holeSeen=new Set(), Qz=null;
function topbar(title,back){
 return `<div class="top">${back?`<button class="back" id="backBtn">← 關卡</button>`:""}
  <div class="title">${title}</div>
  <span class="chip combo ${combo>=5?"hot":""}" id="comboChip">✨ ${combo}</span>
  <span class="chip score en" id="scoreChip">💎 ${shownScore.toLocaleString()}</span>
  <button class="icon" id="muteBtn" aria-label="音效開關">${S.muted?"🔕":"🔔"}</button></div>`;
}
function bindTop(){
 const b=$("#backBtn");if(b)b.onclick=()=>{SFX.tap();if("speechSynthesis" in window)speechSynthesis.cancel();home();};
 $("#muteBtn").onclick=()=>{S.muted=!S.muted;save();$("#muteBtn").textContent=S.muted?"🔕":"🔔";};
}
function journeyPct(){
 const g=unit.groups[gi],n=g.length;
 const learned=g.filter((_,i)=>(phase[i]||0)>=1).length;
 const mastered=Qz?Qz.done.size:0;
 return Math.round(learned/n*45+mastered/n*55);
}
function journey(){
 const p=journeyPct();
 return `<div class="journey"><div class="lab"><span>✦ 過關進度</span><b id="jpct">${p}%</b></div>
  <div class="track"><div class="fill" id="jfill" style="width:${p}%"></div></div>
  <div class="miles"><span class="${p>0?"on":""}">🎧 聽單字</span><span class="${p>=45?"on":""}">✏️ 魔法測驗</span><span class="${p>=100?"on":""}">🏆 過關</span></div></div>`;
}
function updJourney(){const p=journeyPct(),f=$("#jfill"),t=$("#jpct");if(f)f.style.width=p+"%";if(t)t.textContent=p+"%";}

/* ---------- home ---------- */
function home(){
 Qz=null;
 const lv=level(S.score),into=S.score%LV;
 const doneN=unit.groups.filter((_,i)=>S.cleared[gid(unit,i)]).length;
 const nextIdx=unit.groups.findIndex((_,i)=>!S.cleared[gid(unit,i)]);
 app.innerHTML=`<div class="fade">${topbar("")}
  <div class="hero">${mascot("happy")}<div><span class="deco">MAGIA ✦ VERBA</span><h1>星窗魔法單字</h1><p>一次只學 5 個字・先聽再看・答錯也有分</p></div></div>
  <div class="lvcard"><div class="lvrow"><span class="t">Lv.${lv}　${TITLES[Math.min(lv-1,TITLES.length-1)]}</span><span class="n en">${into} / ${LV}</span></div>
   <div class="track" style="margin-top:8px"><div class="fill" style="width:${into/LV*100}%"></div></div>
   <div class="badges">${BADGES.map(b=>`<button class="badge ${S.badges[b.id]?"got":""}" data-b="${b.id}" aria-label="${b.n}">${b.ic}</button>`).join("")}</div></div>
  <div class="units">${UNITS.map(u=>`<button class="unit ${u===unit?"on":""}" data-k="${u.k}">${u.name}<small>${u.sub}</small></button>`).join("")}</div>
  <div class="journey"><div class="lab"><span>🏰 ${unit.name} 過關進度</span><b>${doneN} / ${unit.groups.length}</b></div>
   <div class="track"><div class="fill" style="width:${doneN/unit.groups.length*100}%"></div></div></div>
  <div class="groups">${unit.groups.map((g,i)=>{const c=S.cleared[gid(unit,i)];
    return `<button class="group ${i===nextIdx?"next":""}" data-i="${i}"><b>第 ${i+1} 關</b><span class="peek en">${g.map(c=>c.w).join(" · ")}</span><div class="st">${c===2?"🏆 💎 完美過關":c?"🏆 已過關":"✦ 挑戰"}</div></button>`}).join("")}</div></div>`;
 bindTop();
 app.querySelectorAll(".unit").forEach(b=>b.onclick=()=>{SFX.tap();unit=UNITS.find(u=>u.k===b.dataset.k);S.unit=unit.k;save();home();});
 app.querySelectorAll(".group").forEach(b=>b.onclick=()=>{SFX.sparkle();gi=+b.dataset.i;li=0;phase={};holeSeen=new Set();learn();});
 app.querySelectorAll(".badge").forEach(b=>b.onclick=()=>{const x=BADGES.find(y=>y.id===b.dataset.b);toast(x.ic,x.n+(S.badges[x.id]?"　✓ 已獲得":""),x.d);});
 scrollTo(0,0);
}

/* ---------- learn: sound first, then Chinese ---------- */
function learn(){
 const g=unit.groups[gi],c=g[li],ph=phase[li]||0;
 const holes=cleanEx(c).replace(/<mark>(.*?)<\/mark>/g,(m,t)=>`<button class="hole en" aria-label="點一下看答案">${t}</button>`);
 const collos=collosOf(c);
 app.innerHTML=`<div class="fade">${topbar(`${unit.name}・第 ${gi+1} 關`,true)}${journey()}
  <div class="card">
   <div class="orbwrap"><button class="orb" id="orb" aria-label="播放發音">🔊</button><button class="mini" id="slow" aria-label="慢速">🐢</button></div>
   <div class="word en">${c.w}</div><div class="posrow"><span class="pos">${c.p}</span></div>
   <div class="zhbox" id="zhBox">${ph>=1?`<div class="zh">${c.zh}</div>`:`<button class="reveal wait" id="reveal">🎧 先聽發音…</button>`}</div>
   <div class="more ${ph>=1?"show":""}" id="more">
    ${collos.length?`<div class="sec"><h3>🧩 搭配詞 COLLOCATIONS</h3><div class="collos">${collos.map(x=>{const [e,z]=x.split("|");
      return `<button class="collo" data-say="${esc(e)}"><span>🔊</span><span class="en">${e}</span><small>${z||""}</small></button>`}).join("")}</div></div>`:""}
    <div class="sec"><h3>📝 例句・先猜猜空格</h3><div class="example en">${holes}</div>
     ${c.exZh?`<div class="exzh">${c.exZh}</div>`:""}
     <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="say" id="se">🔊 念例句</button><button class="say" id="sse">🐢 慢慢念</button></div></div>
    ${c.tip&&COLLO[c.id]?`<div class="tipbox">💡 ${c.tip}</div>`:""}
   </div>
  </div>
  <div class="dots">${g.map((_,i)=>`<i class="${i===li?"on":(phase[i]||0)>=1?"seen":""}"></i>`).join("")}</div>
  <div class="nav" id="nav"></div></div>`;
 bindTop();
 const nav=()=>{const p=phase[li]||0;
  $("#nav").innerHTML=`${li>0?`<button class="btn ghost" id="prev">◀</button>`:""}${p<1?`<div class="hint">聽完發音，揭曉中文 ✦</div>`:li<g.length-1?`<button class="btn go" id="next">下一個字 ▶</button>`:`<button class="btn ok" id="toQuiz">開始魔法測驗 ✨</button>`}`;
  const pv=$("#prev");if(pv)pv.onclick=()=>{SFX.tap();li--;learn();};
  const nx=$("#next");if(nx)nx.onclick=()=>{SFX.tap();li++;learn();};
  const q=$("#toQuiz");if(q)q.onclick=()=>{SFX.sparkle();startQuiz();};
 };nav();
 const ready=()=>{const r=$("#reveal");if(r&&r.classList.contains("wait")){r.classList.remove("wait");r.classList.add("ready");r.textContent="✨ 揭曉中文";SFX.tap();}};
 const orb=$("#orb");
 orb.onclick=()=>speak(sayWord(c),.85,orb,ready);
 $("#slow").onclick=e=>speak(sayWord(c),.55,e.currentTarget,ready);
 const rv=$("#reveal");
 if(rv)rv.onclick=()=>{
  phase[li]=1;const r=rv.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26);SFX.sparkle();
  $("#zhBox").innerHTML=`<div class="zh">${c.zh}</div>`;$("#more").classList.add("show");
  addScore(10,$("#zhBox"));updJourney();nav();
  app.querySelectorAll(".dots i")[li].className="on";
 };
 const reveal=e=>{let opened=false;app.querySelectorAll(".hole").forEach(h=>{if(!h.classList.contains("open")){h.classList.add("open");opened=true;}});
  if(opened){SFX.sparkle();if(!holeSeen.has(c.id)){holeSeen.add(c.id);const t=(e&&e.currentTarget)||app.querySelector(".hole");addScore(10,t);const r=t.getBoundingClientRect();burst(r.left+r.width/2,r.top,16,.8);}}};
 app.querySelectorAll(".hole").forEach(h=>h.onclick=reveal);
 $("#se").onclick=e=>{const b=e.currentTarget;reveal();speak(c.ex,.85,b);};
 $("#sse").onclick=e=>{const b=e.currentTarget;reveal();speak(c.ex,.6,b);};
 app.querySelectorAll(".collo").forEach(b=>b.onclick=()=>speak(b.dataset.say.replace(/\bsb\b/g,"somebody").replace(/\+.*$/,"").replace(/=.*$/,""),.85,b));
 if(ph<1){setTimeout(()=>speak(sayWord(c),.85,orb,ready),350);setTimeout(ready,3500);}
 scrollTo(0,0);
}

/* ---------- quiz ---------- */
function startQuiz(){
 const g=unit.groups[gi];
 const L=shuffle(g).map(c=>({c,t:"listen"})),F=shuffle(g).map(c=>({c,t:"fill"}));
 Qz={g,run:{},done:new Set(),queue:[...L,...F],tries:0,right:0,gain:0,total:g.length,since:0};
 nextQ();
}
function distractors(c,key,n=3){
 let pool=Qz.g.filter(x=>x.id!==c.id);
 if(pool.length<n)pool=pool.concat(shuffle(unit.cards.filter(x=>x.id!==c.id&&!pool.includes(x))).slice(0,n-pool.length));
 return [...new Set(shuffle(pool).map(key).filter(v=>v!==key(c)))].slice(0,n);
}
function nextQ(){
 while(Qz.queue.length&&Qz.done.has(Qz.queue[0].c.id))Qz.queue.shift();
 if(!Qz.queue.length){finish();return;}
 Qz.cur=Qz.queue.shift();renderQ();
}
function wordStars(){
 return `<div class="wstars" id="wstars">${Qz.g.map(c=>{const st=Qz.done.has(c.id)?"full":(Qz.run[c.id]||0)>=1?"half":"";
  return `<div class="wstar ${st}"><span>⭐</span><em class="en">${c.w}</em></div>`}).join("")}</div>`;
}
function renderQ(){
 const {c,t}=Qz.cur;
 const key=t==="listen"?(x=>x.zh):answerOf;
 const opts=shuffle([key(c),...distractors(c,key)]);
 const body=t==="listen"
  ?`<span class="qlabel">👂 聽音選意</span><div class="qtitle">聽聽看，這是什麼意思？</div>
    <div class="orbwrap"><button class="orb" id="play" aria-label="播放">🔊</button><button class="mini" id="playSlow" aria-label="慢速">🐢</button></div>`
  :`<span class="qlabel">✏️ 例句填空</span><div class="qtitle">選出空格裡的字</div>
    <div class="sentence en">${cleanEx(c).replace(/<mark>(.*?)<\/mark>/g,'<span class="blank">？</span>')}</div>${c.exZh?`<div class="exzh" style="margin:-4px 0 12px">💭 ${c.exZh}</div>`:""}`;
 app.innerHTML=`<div class="fade">${topbar(`${unit.name}・第 ${gi+1} 關`,true)}${journey()}${wordStars()}
  <div class="card">${body}<div class="opts">${opts.map(o=>`<button class="opt ${t==="fill"?"en":""}">${o}</button>`).join("")}</div>
  <div class="fb" id="fb"></div></div></div>`;
 bindTop();
 if(t==="listen"){
  $("#play").onclick=e=>speak(sayWord(c),.85,e.currentTarget);
  $("#playSlow").onclick=e=>speak(sayWord(c),.55,e.currentTarget);
  setTimeout(()=>speak(sayWord(c),.85,$("#play")),300);
 }
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,key(c)));
}
const PRAISE=["太棒了！","魔法命中！","好厲害！","閃閃發亮！","完美詠唱！","你真的很會！"];
const KIND=["差一點點！","好勇敢的嘗試！","沒關係，魔法要練習！","這題很難，你很努力了！"];
function answer(btn,correct){
 const {c,t}=Qz.cur;const all=app.querySelectorAll(".opt");all.forEach(b=>b.disabled=true);
 const ok=btn.textContent===correct;const fb=$("#fb");
 if(ok){
  btn.classList.add("right");all.forEach(b=>{if(b!==btn)b.classList.add("dim")});
  Qz.right++;combo++;Qz.since++;if(combo>S.bestCombo)S.bestCombo=combo;
  Qz.run[c.id]=(Qz.run[c.id]||0)+1;const mastered=Qz.run[c.id]>=2;if(mastered)Qz.done.add(c.id);
  const pts=100+Math.min(combo,10)*10+(mastered?50:0);Qz.gain+=pts;
  const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top+10,mastered?34:22);
  mastered?SFX.star():SFX.right();
  if(t==="fill"){const parts=answerOf(c).split(" … ");app.querySelectorAll(".blank").forEach((b,i)=>{b.textContent=parts[i]||parts[0];b.classList.add("filled");});}
  fb.innerHTML=mascot("happy","jump")+`<div class="bubble good">${PRAISE[Math.random()*PRAISE.length|0]} +${pts}<small>${mastered?`<span class="en">${c.w}</span> 收服了！⭐ +50`:`連擊 ${combo}・再答對一次就收服這個字`}</small></div>`;
  addScore(pts,btn);
  const cc=$("#comboChip");cc.textContent="✨ "+combo;cc.classList.toggle("hot",combo>=5);
  $("#wstars").outerHTML=wordStars();updJourney();
  if(Qz.since>=5){Qz.since=0;setTimeout(()=>{SFX.burst();rain(8);overlay("MAGIC BURST","魔法爆發！","連續答對 5 題 +200",1400);addScore(200,null);Qz.gain+=200;},700);}
  save();
  setTimeout(()=>speak(t==="fill"?c.ex:sayWord(c),.9),150);
  setTimeout(nextQ,t==="fill"?2300:1500);
 }else{
  btn.classList.add("soft");all.forEach(b=>{if(b.textContent===correct)b.classList.add("right");else if(b!==btn)b.classList.add("dim")});
  Qz.tries++;S.brave++;Qz.run[c.id]=0;Qz.gain+=10;SFX.kind();
  const other=t==="listen"?"fill":"listen";
  Qz.queue.splice(Math.min(2,Qz.queue.length),0,{c,t:other});
  Qz.queue.splice(Math.min(4,Qz.queue.length),0,{c,t});
  fb.innerHTML=mascot("kind","hug")+`<div class="bubble kind">${KIND[Math.random()*KIND.length|0]} 勇氣 +10<small>答案是 ${t==="listen"?`${c.zh}（<span class="en">${c.w}</span>）`:`<span class="en">${correct}</span>（${c.zh}）`}<br>這個字等一下會再來找你玩 💕</small></div>`;
  addScore(10,btn);
  const go=document.createElement("button");go.className="btn go";go.style.cssText="margin-top:12px;width:100%";go.textContent="好，我記住了 ✦";
  go.onclick=()=>{SFX.tap();nextQ();};fb.after(go);
  speak(sayWord(c),.85);save();
 }
}
function finish(){
 const k=gid(unit,gi),perfect=Qz.tries===0;
 S.cleared[k]=Math.max(S.cleared[k]||0,perfect?2:1);
 const bonus=perfect?300:150;S.score+=bonus;Qz.gain+=bonus;save();
 if(perfect)giveBadge("perfect");checkBadges();
 const hasNext=gi<unit.groups.length-1;
 app.innerHTML=`<div class="fade done">${topbar(`${unit.name}・第 ${gi+1} 關`,true)}
  <div class="journey"><div class="lab"><span>✦ 過關進度</span><b>100%</b></div><div class="track"><div class="fill" style="width:100%"></div></div></div>
  <div class="trophy">🏆</div>
  <h2>第 ${gi+1} 關・過關！</h2>
  <div style="color:var(--soft);font-weight:800">${perfect?"💎 完美魔法・全部一次答對":"5 個字全部收服了 ⭐"}</div>
  <div class="bigscore en" id="gain">+0</div>
  <div class="statrow"><div class="stat"><b>${Qz.right}</b><small>答對</small></div><div class="stat"><b>${Qz.tries}</b><small>勇敢嘗試</small></div><div class="stat"><b>${S.bestCombo}</b><small>最高連擊</small></div></div>
  <div class="col">${hasNext?`<button class="btn go" id="nextG">下一關 →</button>`:""}
   <button class="btn ok" id="again">這關再玩一次</button>
   <button class="btn ghost" id="home" style="flex:1">回到關卡地圖</button></div></div>`;
 bindTop();SFX.win();rain(10);
 const target=Qz.gain,t0=performance.now(),el=$("#gain");
 const step=t=>{const p=Math.min(1,(t-t0)/1200);el.textContent="+"+Math.round(target*p).toLocaleString();if(p<1)requestAnimationFrame(step);else{tone(1568,.3,"sine",.1);countUp();}};requestAnimationFrame(step);
 const n=$("#nextG");if(n)n.onclick=()=>{SFX.sparkle();gi++;li=0;phase={};holeSeen=new Set();Qz=null;learn();};
 $("#again").onclick=()=>{SFX.sparkle();startQuiz();};
 $("#home").onclick=()=>{SFX.tap();home();};
}
home();
</script>
